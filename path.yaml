apiVersion: content.astrona.io/v1alpha1
kind: TrainingPath
metadata:
  id: ATP001
  slug: linux-foundation-certified-sysadmin-lfcs
  title: "Linux Foundation Certified System Administrator (LFCS)"
  description: "This path prepares learners for the LFCS certification exam, covering essential Linux system administration skills and knowledge."
  version: "1.0.0"
  language: "en"
  authors:
    - name: "Paris Nakita Kejser"
      email: "paris@astrona.io"
      company: "Astrona.io"
  tags:
    - "Linux"
    - "System Administration"
    - "Certification Preparation"
    - "LFCS"
  license: "Apache-2.0"

spec:
  audience: "Aspiring Linux System Administrators and IT professionals seeking LFCS certification."
  difficulty: "Intermediate"

  estimatedDuration: "4h"

  examPreparation:
    enabled: true
    title: "Linux Foundation Certified System Administrator (LFCS)"
    officialSyllabusUrl: "https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/"
    examId: "LFCS"
    provider: "The Linux Foundation"

  prerequisites:
    - "Basic understanding of Linux command-line operations."
    - "Familiarity with system administration concepts and networking fundamentals."
    - "Access to a Linux environment for hands-on practice."
    - "Completion of the 'Introduction to Linux' course or equivalent experience is recommended."
    - "Knowledge of shell scripting and basic programming concepts is beneficial."

  learningOutcomes:
    - "Demonstrate proficiency in Linux system administration tasks, including user management, file permissions, and process control."
    - "Configure and manage Linux networking, including IP addressing, routing, and firewall settings."
    - "Install, configure, and maintain essential Linux services such as SSH, web servers, and databases."
    - "Troubleshoot common Linux system issues and apply best practices for system maintenance and security."
    - "Prepare effectively for the LFCS certification exam by mastering the required competencies."

  # One stage per exam domain; titles match the exam (astrona-content
  # exams/golden-kubestronaut/lfcs.yaml), weights follow it, and each stage's
  # learning outcomes are the domain's official competencies.
  stages:
    - id: "ATP001-STG001"
      title: "Operations Deployment"
      description: "Keep a Linux system running: kernel parameters, processes and services, scheduled jobs, packages and repositories, recovering from failures, virtual machines, containers and SELinux."
      weight: 25
      learningOutcomes:
        - "Configure kernel parameters, persistent and non-persistent"
        - "Diagnose, identify, manage, and troubleshoot processes and services"
        - "Manage or schedule jobs for executing commands"
        - "Search for, install, validate, and maintain software packages or repositories"
        - "Recover from hardware, operating system, or filesystem failures"
        - "Manage Virtual Machines (libvirt)"
        - "Configure container engines, create and manage containers"
        - "Create and enforce MAC using SELinux"

      content:
        - ref: ATS002
          repository: "https://github.com/astrona-io/ATS002"
          path: "."
          version: "1.0.0"

    - id: "ATP001-STG002"
      title: "Networking"
      description: "Connect and secure a Linux host: IPv4 and IPv6 with name resolution, time sync, OpenSSH, packet filtering and NAT, static routes, bridges and bonds, reverse proxies and load balancers."
      weight: 25
      learningOutcomes:
        - "Configure IPv4 and IPv6 networking and hostname resolution"
        - "Set and synchronize system time using time servers"
        - "Monitor and troubleshoot networking"
        - "Configure the OpenSSH server and client"
        - "Configure packet filtering, port redirection, and NAT"
        - "Configure static routing"
        - "Configure bridge and bonding devices"
        - "Implement reverse proxies and load balancers"

      content:
        - ref: ATS003
          repository: "https://github.com/astrona-io/ATS003"
          path: "."
          version: "1.0.0"

    - id: "ATP001-STG003"
      title: "Storage"
      description: "Lay out and look after storage: LVM, the virtual file system, filesystems, remote filesystems and network block devices, swap, automounters and storage performance."
      weight: 20
      learningOutcomes:
        - "Configure and manage LVM storage"
        - "Manage and configure the virtual file system"
        - "Create, manage, and troubleshoot filesystems"
        - "Use remote filesystems and network block devices"
        - "Configure and manage swap space"
        - "Configure filesystem automounters"
        - "Monitor storage performance"

      content:
        - ref: ATS004
          repository: "https://github.com/astrona-io/ATS004"
          path: "."
          version: "1.0.0"

    - id: "ATP001-STG004"
      title: "Essential Commands"
      description: "The everyday toolbox: Git basics, services, system performance, application constraints, disk space and SSL certificates."
      weight: 20
      learningOutcomes:
        - "Basic Git Operations"
        - "Create, configure, and troubleshoot services"
        - "Monitor and troubleshoot system performance and services"
        - "Determine application and service specific constraints"
        - "Troubleshoot diskspace issues"
        - "Work with SSL certificates"

      content:
        - ref: ATS006
          repository: "https://github.com/astrona-io/ATS006"
          path: "."
          version: "1.0.0"

    - id: "ATP001-STG005"
      title: "Users and Groups"
      description: "Accounts and access: local users and groups, environment profiles, resource limits, ACLs and LDAP accounts."
      weight: 10
      learningOutcomes:
        - "Create and manage local user and group accounts"
        - "Manage personal and system-wide environment profiles"
        - "Configure user resource limits"
        - "Configure and manage ACLs"
        - "Configure the system to use LDAP user and group accounts"

      content:
        - ref: ATS005
          repository: "https://github.com/astrona-io/ATS005"
          path: "."
          version: "1.0.0"
